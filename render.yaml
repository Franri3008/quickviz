services:
  - type: web
    name: quickviz
    runtime: docker
    plan: free
    branch: master
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/version
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: PUBLIC_URL
        value: https://quickviz.franri.dev
      - key: PRODUCTION
        value: "true"
      - key: CREDITS_ANON_DAY
        value: "100"
      - key: CREDITS_USER_DAY
        value: "1000"
      - key: GLOBAL_DAY_USD
        value: "3"
      - key: RENDER_MAX_SCALE
        value: "2"
      - key: RENDER_IDLE_S
        value: "300"
      - key: RATE_RENDER
        value: "20"

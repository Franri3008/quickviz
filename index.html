<!doctype html>
<html><head><meta charset="utf-8"><title>QuickViz</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-sankey@0.12"></script>
<link rel="stylesheet" href="style.css">
</head><body>
<h1>QuickViz</h1>
<div id="demos" hidden></div>
<input id="q" placeholder="Describe your data… e.g. monthly sales per region since 2020" autofocus>
<div id="data">
  <textarea id="csv" rows="3" placeholder="…or paste CSV / TSV here, with a header row"></textarea>
  <div id="datactl">
    <label id="filebtn">Upload .csv<input id="file" type="file" accept=".csv,.tsv,.txt,text/csv" hidden></label>
    <button id="clear" type="button" hidden>Clear data</button>
    <span id="colsum"></span>
  </div>
</div>
<div id="meta"></div><div id="alts"></div><div id="err"></div><div id="cached" hidden>cached</div>
<svg id="chart" width="820" height="420"></svg>
<div id="cycle"><button id="prev" type="button" hidden>&larr;</button><span id="optcount"></span><button id="next" type="button" hidden>&rarr;</button></div>
<div id="actions"><button id="png" type="button" hidden>Download PNG</button><button id="html" type="button" hidden>Download HTML</button></div>
<script src="charts.js"></script>
<script src="app.js"></script>
</body></html>
